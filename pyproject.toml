[project]
name = "spatiamed-common"
version = "0.5.0"
description = "Shared utilities for SpatiaMed platform services"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0",
    "httpx>=0.27",
    "pytz>=2024.1",
    "feedparser>=6.0",
    "pydantic>=2.10",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
# FastAPI is optional: only sm_common.fastapi_guard needs it. Importing the core
# library never requires FastAPI — the guard imports it lazily.
fastapi = ["fastapi>=0.115"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pytz>=2024.1",
    "respx>=0.21",
    "fastapi>=0.115",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sm_common", "sm_common.integrations", "sm_common.integrations.adapters"]

[tool.setuptools.package-data]
sm_common = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The HMS integrations subtree carries pre-existing lint debt (unused imports,
# import ordering, line length) that predates the v0.4.0 consolidation and is
# out of scope for it. Gated separately so CI stays meaningful for everything
# else; clean up as a follow-up before extending these adapters.
"sm_common/integrations/**" = ["E501", "F401", "I001", "UP017"]
"tests/integrations/**" = ["E501", "F401", "I001", "UP017"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Pre-existing strict-mode debt in the HMS integrations subtree (untyped adapter
# signatures, feedparser lacking stubs). Mirrors the `ignore_errors` pattern the
# sibling services use for untyped decorator-heavy modules. Out of scope for
# v0.4.0; the top-level primitives are fully strict-clean.
[[tool.mypy.overrides]]
module = "sm_common.integrations.*"
ignore_errors = true
