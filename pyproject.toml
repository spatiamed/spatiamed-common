[project]
name = "spatiamed-common"
version = "0.2.1"
description = "Shared utilities for SpatiaMed platform services"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0",
    "httpx>=0.27",
    "pytz>=2024.1",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pytz>=2024.1",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sm_common", "sm_common.integrations", "sm_common.integrations.adapters"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
